name: Validate and release Ceuvia Weather Card
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_demo.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 -m compileall -q custom_components
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-ha.txt
      - run: pip install -r tests/requirements-ha.txt
      - run: python tests/ha_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: ceuvia-home-assistant-check
          path: docs/ha-smoke-results.json
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: python3 tools/build_demo.py
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: ceuvia-browser-check
          path: |
            docs/test-results.json
            docs/card-*.png
            docs/editor.png
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [hassfest, sources, browser, home-assistant]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_demo.py
      - run: python3 tools/build_release.py
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('custom_components/tempo_vivo/manifest.json')).version;
            const tag = `v${version}`;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data;
            } catch (e) {
              if (e.status !== 404) throw e;
              release = (await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, target_commitish: context.sha,
                name: `Ceuvia Weather Card ${version}`,
                body: 'Ceuvia Weather Card — O clima ganha vida.\n\nNova identidade no HACS, integração e seletor de cartões; português e inglês; animações naturais e sensores da casa. Cartões Tempo Vivo e IDs de sensores permanecem compatíveis.\n\nAtualize no HACS, reinicie o Home Assistant e recarregue o painel. Instalação manual: extraia o ZIP e copie a pasta custom_components para sua configuração. Consulte README e docs/MIGRATION.md.\n\nAssets: ZIP de instalação, módulo independente, demonstração e SHA256SUMS.txt. Publicação após Hassfest, testes Python, navegador e Home Assistant real isolado.',
                draft: false, prerelease: false
              })).data;
            }
            const existing = (await github.rest.repos.listReleaseAssets({...context.repo, release_id: release.id})).data;
            for (const name of fs.readdirSync('dist')) {
              if (existing.some(asset => asset.name === name)) continue;
              const data = fs.readFileSync(`dist/${name}`);
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name, data,
                headers: {'content-type': 'application/octet-stream', 'content-length': data.length}
              });
            }
